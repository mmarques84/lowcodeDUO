# Compose único local: MySQL + n8n (com Postgres próprio) + front (v2, Next.js).
# Reaproveita os volumes já existentes (lowcodeduo_mysql_data, n8n-local_n8n_data,
# n8n-local_n8n_postgres_data) — nenhum dado é perdido ao trocar pra este arquivo.
# Antes de subir, pare os containers avulsos antigos: docker stop aluguel_mysql n8n-local n8n-postgres-local
# Segredos vêm de .env (copie .env.example e preencha) — nunca commitado.
services:
  mysql:
    image: mysql:8.0
    container_name: lowcodeduo_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./v1/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - lowcodeduo

  n8n-postgres:
    image: postgres:16
    container_name: n8n_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: "${N8N_POSTGRES_PASSWORD}"
      POSTGRES_DB: n8n
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    networks:
      - lowcodeduo

  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: n8n
    restart: unless-stopped
    depends_on:
      - n8n-postgres
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: "${N8N_POSTGRES_PASSWORD}"
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: "http://localhost:5678/"
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      GENERIC_TIMEZONE: America/Bahia
      TZ: America/Bahia
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - lowcodeduo

  front:
    build:
      context: ./v2
      dockerfile: Dockerfile
    container_name: lowcodeduo_front
    restart: unless-stopped
    depends_on:
      - mysql
      - n8n
    environment:
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME}"
      JWT_SECRET: "${JWT_SECRET}"
      N8N_BASE_URL: "http://n8n:5678/webhook"
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - lowcodeduo

networks:
  lowcodeduo:
    name: lowcodeduo_net

volumes:
  mysql_data:
    external: true
    name: lowcodeduo_mysql_data
  n8n_data:
    external: true
    name: n8n-local_n8n_data
  n8n_postgres_data:
    external: true
    name: n8n-local_n8n_postgres_data
